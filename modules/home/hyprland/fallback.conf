bindm=$mainMod, mouse:272, movewindow
bindm=$mainMod, mouse:273, resizewindow

binds {
  movefocus_cycles_fullscreen=true
}

decoration {
  blur {
    brightness=1
    contrast=1.400000
    enabled=true
    ignore_opacity=true
    new_optimizations=true
    noise=0
    passes=2
    size=3
    xray=true
  }

  shadow {
    color=rgba(00000055)
    enabled=true
    offset=0 2
    range=20
    render_power=3
  }
  rounding=0
}

dwindle {
  force_split=2
  preserve_split=true
  special_scale_factor=1.000000
  split_width_multiplier=1.000000
  use_active_for_splits=true
}

exec-once=dbus-update-activation-environment --all --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=noctalia
exec-once=hyprctl setcursor Bibata-Modern-Ice 24
exec-once=[workspace 1 silent] zen-beta
exec-once=[workspace 2 silent] ghostty

general {
  border_size=2
  col.active_border=rgb(8AADF4)
  col.inactive_border=0x00000000
  gaps_in=6
  gaps_out=6
  layout=dwindle
}

input {
  touchpad {
    natural_scroll=true
  }
  float_switch_override_focus=0
  follow_mouse=0
  kb_layout=us,ru
  kb_options=grp:alt_shift_toggle
  mouse_refocus=0
  numlock_by_default=true
  repeat_delay=300
}

master {
  new_status=master
  special_scale_factor=1
}

misc {
  always_follow_on_dnd=true
  disable_autoreload=true
  disable_hyprland_logo=true
  enable_swallow=true
  focus_on_activate=true
  layers_hog_keyboard_focus=true
  middle_click_paste=false
  on_focus_under_fullscreen=2
}

