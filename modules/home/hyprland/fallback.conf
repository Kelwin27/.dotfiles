exec-once = /nix/store/8snmq54bp5d5vp5dihgn7xr53hayx629-dbus-1.16.2/bin/dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop hyprland-session.target
$mainMod=SUPER
animations {
  bezier=fluent_decel, 0, 0.2, 0.4, 1
  bezier=easeOutCirc, 0, 0.55, 0.45, 1
  bezier=easeOutCubic, 0.33, 1, 0.68, 1
  bezier=fade_curve, 0, 0.55, 0.45, 1
  bezier=easeOutQuint, 0.23, 1, 0.32, 1
  bezier=almostLinear, 0.5, 0.5, 0.75, 1.0
  bezier=quick, 0.15, 0, 0.1, 1
  animation=windows,     1, 3.79, easeOutQuint
  animation=windowsIn,   1, 4.1,  easeOutQuint, popin 87%
  animation=windowsOut,  1, 1.49, linear,       popin 87%
  animation=windowsMove, 1, 3.79, easeOutQuint
  animation=fadeIn,      1, 1.73, almostLinear
  animation=fadeOut,     1, 1.46, almostLinear
  animation=fade,        1, 3.03, quick
  animation=fadeSwitch,  0, 1,   easeOutCirc
  animation=fadeShadow,  1, 5,   easeOutCirc
  animation=fadeDim,     1, 4,   fluent_decel
  animation=layers,      1, 3.81, easeOutQuint
  animation=workspaces,  1, 2,   easeOutCubic, fade
  enabled=true
}

