[mgr]
# kept at the preset value; carried over from superfile's sidebar_width = 18
ratio = [ 1, 4, 3 ]
# "natural" rather than plain alphabetical, so 2.md sorts before 10.md
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
wrap = "no"
tab_size = 2
max_width = 600
max_height = 900
image_delay = 30
image_filter = "triangle"
image_quality = 75

[opener]
edit = [
  { run = 'nvim %s', desc = "nvim", for = "unix", block = true },
]
# replaces superfile's dir_editor = "nemo", which no longer exists
open = [
  { run = 'ghostty --title=%t -e yazi %s1', desc = "Open in a new ghostty", for = "unix" },
]