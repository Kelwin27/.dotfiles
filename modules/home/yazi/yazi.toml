[mgr]
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
wrap = "no"
tab_size = 2
max_width = 600
max_height = 900
image_delay = 30
image_filter = "triangle"
image_quality = 75

[opener]
edit = [
  { run = 'nvim %s', desc = "nvim", for = "unix", block = true },
]
open = [
  { run = 'ghostty --title=%t -e yazi %s1', desc = "Open in a new ghostty", for = "unix" },
]
