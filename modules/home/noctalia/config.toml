[theme]
mode = "dark"
source = "builtin"
builtin = "Catppuccin"

[shell]
clipboard_enabled = true
clipboard_history_max_entries = 50
clipboard_keep_from_closed_apps = true
clipboard_auto_paste = "auto"

[accessibility]
ui_scale = 1.2

[wallpaper]
enabled = true
directory = "@dataHome@/wallpapers"
fill_mode = "crop"
transition = [ "fade" ]
transition_duration = 1500

[wallpaper.default]
path = "@dataHome@/wallpapers/forest_moss.png"

[lockscreen]
enabled = true
blurred_desktop = false
blur_intensity = 0.5
tint_intensity = 0.3
transition = [ "fade" ]
transition_duration = 1500
# monitors  = [ "eDP-1" ]  # empty shows on every output

[dock]
enabled = false

[shell.launcher]
categories = true
show_icons = true
sort_by_usage = true
app_grid = false
compact = false

[notification]
enable_daemon = true
timeout = 3000 
show_app_name = true
show_actions = true
layer = "top"
background_opacity = 0.9
border = true
border_color = "outline"
border_width = 1
offset_x = 20
offset_y = 8
follow_focused_output = false

[system.monitor]
gpu_poll_seconds = 10

[bar.main]
position = "top"
thickness = 46
background_opacity = 0.7
compositor_blur = false
shadow = true
margin_ends = 24
margin_edge = 6
padding = 14
widget_spacing = 6
scale = 1.2
font_scale = 1.0
font_weight = 600
auto_hide = false
reserve_space = true

radius = 20
radius_top_left = 20
radius_top_right = 20
radius_bottom_left = 20
radius_bottom_right = 20

start = [ "group:nav" ]
center = [ "clock" ]
end = [ "group:metrics", "group:sys", "group:notif", "session" ]

[[bar.main.capsule_group]]
id = "nav"
members = [ "launcher", "workspaces" ]
fill = "surface_container"
opacity = 0.9
radius = 12.0

[[bar.main.capsule_group]]
id = "metrics"
# infix marker: expands to `disk` with its own separator on the desktop and to
# nothing on the laptop. a group fixes its membership, so it cannot span a whole
# list entry the way this marker did while the widgets sat ungrouped.
members = [ "cpu", "memory", @diskWidget@"gpu" ]
fill = "surface_container"
opacity = 0.9
radius = 12.0
# folded down to cpu until hovered: the values reflow inside this pill instead of
# shoving the bar around, and folding the rest keeps the laptop's right lane on
# screen. widget_spacing is inherited from the bar, as in the sibling groups.
accordion = true
accordion_direction = "end"

[[bar.main.capsule_group]]
id = "sys"
members = [ "tray", "network", "volume", "battery" ]
fill = "surface_container"
opacity = 0.9
radius = 12.0

[[bar.main.capsule_group]]
id = "notif"
members = [ "keyboard_layout", "clipboard", "notifications" ]
fill = "surface_container"
opacity = 0.9
radius = 12.0

[widget.clock]
tooltip_format = "%A, %d %B %Y" 

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
icon_color = "primary"

[widget.memory]
type = "sysmon"
stat = "ram_used"
icon_color = "secondary"

[widget.disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
icon_color = "tertiary"

[widget.gpu]
type = "sysmon"
stat = "gpu_usage"
icon_color = "primary"

[widget.network]
show_label = false

[widget.session]
icon_color = "error"

[widget.keyboard_layout]
color = "#ffad33"

[osd]
position = "top_right"
orientation = "horizontal"
hide_delay_ms = 1400
background_opacity = 0.97
border = true
border_color = "outline"
border_width = 1
follow_focused_output = false
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
brightness = true
lock_keys = true
wifi = true
bluetooth = false
power_profile = false
keyboard_layout = false
privacy = false
caffeine = false
nightlight = false
dnd = false

[shell.screenshot]
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot_%Y_%m_%d_at_%Hh%Mm%Ss"
annotate = true
save_to_file = true
copy_to_clipboard = true
show_cursor = false
close_on_copy = true
close_on_save = true
